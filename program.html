<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Program · Hazen Gone Loco</title>
<link rel="icon" type="image/png" href="assets/hare-yellow.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:      #F6ECF4;
    --ink-soft: #B79EC4;
    --ink-muted:#8B7A9C;
    --body:     #C6AFD3;
    --accent:   #FFD16B;
    --accent-2: #F0B929;
    --rose:     #E14E6B;
    --violet:   #9B6BD0;
    --bg:       #141038;
    --line:     rgba(246,236,244,0.14);
    --line-2:   rgba(246,236,244,0.2);
    --dashed:   rgba(246,236,244,0.16);
    --font: "Hanken Grotesk", sans-serif;
    --mono: "Space Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
  }
  .gradient {
    position: fixed; inset: 0; z-index: -2;
    background:
      radial-gradient(120% 55% at 78% 2%, rgba(214,74,40,.5), transparent 54%),
      radial-gradient(95% 60% at 10% 22%, rgba(225,78,107,.42), transparent 56%),
      radial-gradient(110% 80% at 50% 112%, rgba(72,48,152,.7), transparent 62%),
      linear-gradient(176deg,#2a1546 0%,#4a2150 22%,#6c2c4f 40%,#3c2668 62%,#262a6e 100%);
  }
  .grain {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    opacity: 0.7; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 2 -0.5'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-size: 300px 300px;
  }
  .grain-coarse {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    opacity: 0.28; mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='c'><feTurbulence type='fractalNoise' baseFrequency='0.4' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 1.2 -0.2'/></filter><rect width='100%' height='100%' filter='url(%23c)'/></svg>");
    background-size: 420px 420px;
  }
  /* topbar */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px clamp(20px, 5.5vw, 90px);
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(180deg, rgba(20,12,40,0.72) 0%, rgba(20,12,40,0) 100%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .back {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-soft); text-decoration: none;
    transition: color .25s;
  }
  .back:hover { color: var(--accent); }
  .back .chev { font-size: 18px; font-weight: 400; line-height: 1; }
  .eyebrow-center {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--accent);
    display: flex; align-items: center; gap: 6px;
  }
  .eyebrow-center .dot { color: var(--accent); }
  .count {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  /* body */
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }
  .days {
    display: flex; flex-direction: column; gap: 12px;
  }
  .day {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(84,46,104,0.42);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: border-color .3s, background .3s;
  }
  .day:hover { border-color: rgba(255,209,107,0.35); }
  .day.open {
    border: 1px solid var(--line-2);
    border-radius: 18px;
    background: linear-gradient(155deg, rgba(108,50,90,0.62), rgba(60,42,110,0.6));
    cursor: default;
  }

  /* watermark day number */
  .day .wm {
    position: absolute; pointer-events: none;
    font-family: var(--font); font-weight: 700;
    color: rgba(246,236,244,0.06);
    top: -8px; right: 10px; font-size: 56px; line-height: 1;
    transition: font-size .3s, top .3s, color .3s;
  }
  .day.open .wm {
    font-size: 104px; top: -16px; right: 6px;
    color: rgba(255,209,107,0.09);
  }

  /* collapsed layout */
  .day .row {
    padding: 15px 16px;
    display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 1;
  }
  .day.open .row { display: none; }

  .day .rowTxt .eb {
    font-family: var(--mono); font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent);
  }
  .day .rowTxt .ti {
    font-family: var(--font); font-weight: 700; font-size: 18px; letter-spacing: -0.01em;
    color: var(--ink); margin-top: 4px;
  }
  .day .caret { font-size: 13px; color: var(--ink-muted); }

  /* expanded */
  .day .expanded { display: none; padding: 0; position: relative; z-index: 1; }
  .day.open .expanded { display: block; }

  .day .upper { padding: 18px 18px 14px; }
  .day .expanded .eb {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent);
  }
  .day .expanded .ti {
    font-family: var(--font); font-weight: 700; font-size: 25px; line-height: 1.04;
    letter-spacing: -0.02em; color: var(--ink); margin-top: 7px;
  }
  .day .expanded p {
    font-size: 14px; line-height: 1.58; color: var(--body); max-width: 42ch;
    margin-top: 11px;
  }
  .day .expanded p + p { margin-top: 9px; }

  .weather {
    margin-top: 14px;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .weather .temp {
    font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent);
    margin-right: 2px;
  }
  .tag {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 999px;
    background: rgba(246,236,244,0.06); border: 1px solid;
  }
  .tag.rose   { color: var(--rose);   border-color: rgba(225,78,107,0.35); }
  .tag.amber  { color: var(--accent); border-color: rgba(255,209,107,0.35); }
  .tag.violet { color: var(--violet); border-color: rgba(155,107,208,0.35); }

  .strip {
    border-top: 1.5px dashed var(--dashed);
    display: grid; grid-template-columns: 1fr 1fr;
  }
  .strip .cell {
    padding: 11px 16px;
  }
  .strip .cell + .cell { border-left: 1px solid rgba(246,236,244,0.1); }
  .strip .lbl {
    font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-muted);
  }
  .strip .val {
    font-size: 13px; color: var(--ink); margin-top: 3px;
  }

  /* reveal on scroll */
  .reveal { opacity: 0; transform: translateY(14px); transition: opacity .55s ease, transform .55s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  @media (min-width: 720px) {
    main { max-width: 620px; }
  }

  /* nav menu */
  .nav-btn {
    width: 34px; height: 34px; border-radius: 8px;
    border: 1.4px solid rgba(255,209,107,0.55);
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(20,12,40,0.35);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    cursor: pointer;
    transition: border-color .25s, background .25s, transform .25s;
    padding: 0;
  }
  .nav-btn:hover { border-color: var(--accent); background: rgba(20,12,40,0.55); }
  .nav-btn .bars { display: flex; flex-direction: column; gap: 4px; }
  .nav-btn .bars span {
    display: block; width: 16px; height: 2px; background: var(--accent); border-radius: 1px;
    transition: transform .25s, opacity .2s;
  }
  .nav-btn[aria-expanded="true"] .bars span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .nav-btn[aria-expanded="true"] .bars span:nth-child(2) { opacity: 0; }
  .nav-btn[aria-expanded="true"] .bars span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

  .nav-menu {
    position: fixed;
    top: 66px;
    right: clamp(20px, 5.5vw, 90px);
    min-width: 240px;
    padding: 10px;
    border-radius: 14px;
    border: 1px solid rgba(246,236,244,0.14);
    background: linear-gradient(155deg, rgba(60,38,104,0.92), rgba(18,14,44,0.94));
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: 0 30px 60px rgba(6,4,18,0.55);
    z-index: 30;
    opacity: 0; transform: translateY(-6px) scale(0.98);
    pointer-events: none;
    transition: opacity .22s ease, transform .22s cubic-bezier(.2,.7,.2,1);
  }
  .nav-menu.open { opacity: 1; transform: none; pointer-events: auto; }
  .nav-menu a {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 14px; border-radius: 10px;
    color: var(--ink); text-decoration: none;
    font-family: "Hanken Grotesk", sans-serif; font-size: 15px; font-weight: 600; letter-spacing: -0.005em;
    transition: background .18s, color .18s;
  }
  .nav-menu a:hover { background: rgba(255,209,107,0.09); color: var(--accent); }
  .nav-menu a .mono {
    font-family: "Space Mono", monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-muted);
  }
  .nav-menu a:hover .mono { color: var(--accent); }
  .nav-menu a.current { color: var(--accent); background: rgba(255,209,107,0.06); }
  .nav-menu a.current .mono { color: var(--accent); }

  .nav-backdrop {
    position: fixed; inset: 0; z-index: 25;
    background: rgba(6,4,18,0.4);
    opacity: 0; pointer-events: none;
    transition: opacity .22s ease;
  }
  .nav-backdrop.open { opacity: 1; pointer-events: auto; }

  @media (prefers-reduced-motion: reduce) {
    .nav-menu, .nav-backdrop, .nav-btn .bars span { transition: none; }
  }

</style>
</head>
<body>
  <nav class="nav-menu" id="navMenu" role="menu">
      <a href="index.html"><span>Home</span><span class="mono">HZL</span></a>
      <a href="program.html" class="current"><span>The Program</span><span class="mono">10 DAYS</span></a>
      <a href="packing.html"><span>Packing</span><span class="mono">DUFFEL</span></a>
      </nav>
      <div class="nav-backdrop" id="navBackdrop"></div>
  <div class="gradient"></div>
  <div class="grain"></div>
  <div class="grain-coarse"></div>

  <header class="topbar">
    <span class="eyebrow-center"><span class="dot">◆</span> The Program</span>
    <button class="nav-btn" id="navBtn" aria-label="Menu" aria-expanded="false" aria-controls="navMenu">
        <span class="bars"><span></span><span></span><span></span></span>
      </button>
  </header>

  <main>
    <div class="days" id="days">
      <!-- Days populated via JS from DAYS[] -->
    </div>
  </main>

<script>
const DAYS = [
  {
    n: 1, ord: 'ONE', when: 'THU 29 OCT', place: 'LIMA',
    title: 'Arrival — Lima',
    paras: [
      "We land in two groups: David around 16:50 via Colombia, Dick, Paultje and Paul from Amsterdam around 18:10. Private transfers take both groups into the city and to Hugo's mansion.",
      "First night is just settling in and getting some sleep. The trip doesn't really start yet, but it's close."
    ],
    temp: '18–24°',
    tags: [{t:'HUMID',c:'rose'},{t:'STRONG SUN',c:'amber'},{t:'AM FOG',c:'violet'}],
    transport: 'Private transfer',
    outfit: 'Comfy travel outfit'
  },
  {
    n: 2, ord: 'TWO', when: 'FRI 30 OCT', place: 'LIMA',
    title: 'Around Lima',
    paras: [
      "We start with a slow morning, then take a city tour: ancient pyramids, colonial squares, modern neighbourhoods, coast.",
      "In the evening our first proper Peruvian dinner."
    ],
    temp: '18–24°',
    tags: [{t:'HUMID',c:'rose'},{t:'MILD',c:'amber'},{t:'CLEAR',c:'amber'}],
    transport: 'Private tour + on foot',
    outfit: 'Light layers, SPF + shades'
  },
  {
    n: 3, ord: 'THREE', when: 'SAT 31 OCT', place: 'LIMA',
    title: "Lima's finest",
    paras: [
      "Bernard arrives around 06:05 and rests. We have another slow morning and around lunch we all learn to make ceviche and pisco sours in a real kitchen — hands-on, a bit messy, probably a bit drunk.",
      "Afternoon holds few plans. By evening we're all together for one of the city's finest dining."
    ],
    temp: '18–24°',
    tags: [{t:'CLEAR',c:'amber'},{t:'STRONG SUN',c:'amber'},{t:'COOL PM',c:'violet'}],
    transport: 'On foot + taxi',
    outfit: 'Light layers, SPF'
  },
  {
    n: 4, ord: 'FOUR', when: 'SUN 1 NOV', place: 'SACRED VALLEY',
    title: 'Fly to Cusco & Pisac',
    paras: [
      "Possibly a little tired. 11:35 flight to Cusco, landing 13:00. The air is noticeably cooler and thinner as soon as we step out. From there we drive through the mountains to Pisac — markets, cafés, Inca ruins on the hillside.",
      "Evening in the Sacred Valley. Higher up, slower pace."
    ],
    temp: '10–20°',
    tags: [{t:'COLD PM',c:'violet'},{t:'STRONG UV',c:'amber'},{t:'ALTITUDE',c:'violet'}],
    transport: 'Flight + mountain transfer',
    outfit: 'Fleece, sunscreen'
  },
  {
    n: 5, ord: 'FIVE', when: 'MON 2 NOV', place: 'SACRED VALLEY',
    title: 'Zipline & stars',
    paras: [
      "Free morning to acclimatise. In the afternoon we zipline across the valley — proper adrenaline and views for days.",
      "Jacuzzi at sunset, dinner under the stars, quiet in the mountains. Trust us. This is going to be special."
    ],
    temp: '10–20°',
    tags: [{t:'SUNNY AM',c:'amber'},{t:'COLD PM',c:'violet'},{t:'STRONG UV',c:'amber'}],
    transport: 'Local transfer',
    outfit: 'Layers, wind jacket, hiking boots'
  },
  {
    n: 6, ord: 'SIX', when: 'TUE 3 NOV', place: 'SACRED VALLEY → CUSCO',
    title: 'Into Cusco',
    paras: [
      "Relaxed morning in the mountains. 11:00 transfer to Cusco, arriving 13:00. Afternoon is open — wander the old city, sit in a plaza, check out San Blas."
    ],
    temp: '10–20°',
    tags: [{t:'SUN + CLOUD',c:'amber'},{t:'COLD PM',c:'violet'},{t:'ALTITUDE',c:'violet'}],
    transport: 'Mountain transfer',
    outfit: 'Fleece, comfy shoes'
  },
  {
    n: 7, ord: 'SEVEN', when: 'WED 4 NOV', place: 'TAMBOPATA',
    title: 'Into the Amazon',
    paras: [
      "After breakfast, 09:40 flight to Puerto Maldonado, landing 10:45. Then road and river from 11:00 to 13:00, deeper into Tambopata. Warm, humid, sticky.",
      "First night in the Amazon — completely different from where we were 24 hours ago."
    ],
    temp: '24–32°',
    tags: [{t:'HOT',c:'rose'},{t:'VERY HUMID',c:'rose'},{t:'BUGS',c:'violet'}],
    transport: 'Flight + road + river boat',
    outfit: 'Light breathable, repellent, long sleeves at dusk'
  },
  {
    n: 8, ord: 'EIGHT', when: 'THU 5 NOV', place: 'TAMBOPATA',
    title: 'Deep jungle',
    paras: [
      "Full day in the jungle. Macaw clay lick at dawn, boat ride on quiet water with river otters, walking forest trails. Plenty we've never seen before.",
      "Probably one of the days we'll talk about for a long time."
    ],
    temp: '24–32°',
    tags: [{t:'HOT',c:'rose'},{t:'VERY HUMID',c:'rose'},{t:'PM SHOWERS',c:'violet'}],
    transport: 'River boat + forest trails',
    outfit: 'Breathable, water shoes, repellent'
  },
  {
    n: 9, ord: 'NINE', when: 'FRI 6 NOV', place: 'TAMBOPATA → LIMA → HOME',
    title: 'The long way home',
    paras: [
      "One last morning in the rainforest. 12:45 flight to Lima, landing 14:20. Onward connections around 20:10–21:05 for most of us. David flies out the next morning."
    ],
    temp: '24 → 18°',
    tags: [{t:'HUMID',c:'rose'},{t:'TRAVEL DAY',c:'violet'}],
    transport: 'River + flights',
    outfit: 'Comfy travel layers'
  },
  {
    n: 10, ord: 'TEN', when: 'SAT 7 NOV', place: 'HOME',
    title: 'Home',
    paras: [
      "Home. Most land in NL around 14:00, Curaçao around 18:00. What a trip. Where next?"
    ],
    temp: null,
    tags: [{t:'TRAVEL DAY',c:'violet'}],
    transport: 'Flights home',
    outfit: "Whatever's comfiest"
  }
];

const daysEl = document.getElementById('days');
DAYS.forEach((d, idx) => {
  const el = document.createElement('article');
  el.className = 'day reveal' + (idx === 0 ? ' open' : '');
  el.setAttribute('data-idx', String(idx));
  const tagsHtml = d.tags.map(t => `<span class="tag ${t.c}">${t.t}</span>`).join('');
  const tempHtml = d.temp ? `<span class="temp">${d.temp}</span>` : '';
  el.innerHTML = `
    <div class="wm">${d.n}</div>
    <div class="row">
      <div class="rowTxt">
        <div class="eb">DAY ${d.ord} · ${d.when} · ${d.place}</div>
        <div class="ti">${d.title}</div>
      </div>
      <div class="caret">⌄</div>
    </div>
    <div class="expanded">
      <div class="upper">
        <div class="eb">DAY ${d.ord} · ${d.when} · ${d.place}</div>
        <div class="ti">${d.title}</div>
        ${d.paras.map(p => `<p>${p}</p>`).join('')}
        <div class="weather">${tempHtml}${tagsHtml}</div>
      </div>
      <div class="strip">
        <div class="cell"><div class="lbl">TRANSPORT</div><div class="val">${d.transport}</div></div>
        <div class="cell"><div class="lbl">OUTFIT</div><div class="val">${d.outfit}</div></div>
      </div>
    </div>
  `;
  daysEl.appendChild(el);
});

// Accordion behavior
daysEl.addEventListener('click', e => {
  const day = e.target.closest('.day');
  if (!day || day.classList.contains('open')) return;
  daysEl.querySelectorAll('.day.open').forEach(d => d.classList.remove('open'));
  day.classList.add('open');
});

// Reveal on scroll
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
}, { threshold: 0.16 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
<script>/* nav-init */
  (function(){
    const btn = document.getElementById('navBtn');
    const menu = document.getElementById('navMenu');
    const backdrop = document.getElementById('navBackdrop');
    if (!btn || !menu) return;
    function setOpen(open) {
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      menu.classList.toggle('open', open);
      backdrop.classList.toggle('open', open);
    }
    btn.addEventListener('click', e => { e.stopPropagation(); setOpen(btn.getAttribute('aria-expanded') !== 'true'); });
    backdrop.addEventListener('click', () => setOpen(false));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });
    menu.addEventListener('click', e => { if (e.target.closest('a')) setOpen(false); });
  })();
</script>
</body>
</html>
